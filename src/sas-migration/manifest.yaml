# Application manifest for the "SAS Migration" project.
# Domain: Root | Domain unit: Data (domain units are not part of this manifest).
# One manifest = one SMUS project. NCMS Master Data has its own manifest in ../ncms-master-data/.
# Run the CLI from this directory.
#
# Prerequisite: the Oracle connection `datastore_sas_reporting` must exist in each target project.
# The CLI cannot create Oracle connections; it is provisioned outside this manifest (Terraform).
applicationName: SAS-Migration

content:
  storage:
    # Glue ETL scripts (PySpark and plain Python)
    - name: code
      connectionName: default.s3_shared
      include:
        - "jobs/"
      exclude:
        - .ipynb_checkpoints/
        - __pycache__/
        - "*.pyc"
        - .libs.json
    # MWAA Serverless DAG definitions
    - name: workflows
      connectionName: default.s3_shared
      append: true
      include:
        - "workflows/"
      exclude:
        - .ipynb_checkpoints/
        - __pycache__/
        - "*.pyc"
        - .libs.json

  workflows:
    - workflowName: smv2-renewal
      connectionName: default.workflow_serverless
    - workflowName: smv2-reserving
      connectionName: default.workflow_serverless
    - workflowName: smv2-reportingteam
      connectionName: default.workflow_serverless
    # Registers the Glue jobs (create-or-update). Folded into the DAGs above once job-to-workflow mapping is known.
    - workflowName: smv2-glue-jobs
      connectionName: default.workflow_serverless

stages:
  # Bundle source. Real values, no bootstrap actions.
  dev:
    stage: DEV
    domain:
      name: Root
      region: eu-central-1
    project:
      name: SAS Migration
      role:
        arn: arn:aws:iam::${AWS_ACCOUNT_ID_DEV}:role/TODO-sas-migration-dev # TODO: stub
    environment_variables:
      ENVIRONMENT: dev
      ORACLE_CONNECTION_NAME: datastore_sas_reporting
    deployment_configuration:
      storage:
        - name: code
          connectionName: default.s3_shared
          targetDirectory: smv2/jobs
        - name: workflows
          connectionName: default.s3_shared
          targetDirectory: smv2/workflows

  uat:
    stage: UAT
    domain:
      name: ${UAT_DOMAIN_NAME:Root}
      region: ${UAT_DOMAIN_REGION:eu-central-1}
    project:
      name: ${UAT_PROJECT_NAME:SAS Migration}
      role:
        arn: arn:aws:iam::${AWS_ACCOUNT_ID_UAT}:role/TODO-sas-migration-uat # TODO: stub
    environment_variables:
      ENVIRONMENT: uat
      ORACLE_CONNECTION_NAME: datastore_sas_reporting
    bootstrap:
      actions:
        # One action creates all four workflows.
        - type: workflow.create
        # TODO: enable once you want deploy to create/run the Glue jobs.
        # - type: workflow.run
        #   workflowName: smv2-glue-jobs
        #   trailLogs: true
    deployment_configuration:
      storage:
        - name: code
          connectionName: default.s3_shared
          targetDirectory: smv2/jobs
        - name: workflows
          connectionName: default.s3_shared
          targetDirectory: smv2/workflows

  prd:
    stage: PRD
    domain:
      name: ${PRD_DOMAIN_NAME:Root}
      region: ${PRD_DOMAIN_REGION:eu-central-1}
    project:
      name: ${PRD_PROJECT_NAME:SAS Migration}
      role:
        arn: arn:aws:iam::${AWS_ACCOUNT_ID_PRD}:role/TODO-sas-migration-prd # TODO: stub
    environment_variables:
      ENVIRONMENT: prd
      ORACLE_CONNECTION_NAME: datastore_sas_reporting
    bootstrap:
      actions:
        - type: workflow.create
    deployment_configuration:
      storage:
        - name: code
          connectionName: default.s3_shared
          targetDirectory: smv2/jobs
        - name: workflows
          connectionName: default.s3_shared
          targetDirectory: smv2/workflows
